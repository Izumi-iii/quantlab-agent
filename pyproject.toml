[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-agent"
version = "0.1.0"
description = "A tool-calling agent for reproducible financial data analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.3,<4",
    "pydantic>=2.12,<3",
    "matplotlib>=3.10,<4",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[project.scripts]
quantlab-agent = "quantlab_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
